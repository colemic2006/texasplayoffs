name: MaxPreps probe (one-off)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pdfplumber beautifulsoup4
      - run: python3 scripts/mp_probe.py
