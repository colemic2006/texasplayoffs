name: Past seasons' game sites

# Places the 2022-2025 game sites from season/history_sites.json on the map and writes them into
# public/data/<year>.json. Runs on demand, and whenever that file changes. It has its own lock: in the
# season job's, a waiting run is dropped whenever the next 15-minute season check queues.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['season/history_sites.json', 'scripts/history_sites.py']

permissions:
  contents: write
  actions: write

jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: history-sites
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pdfplumber beautifulsoup4
      - name: Place past seasons' sites
        run: python3 scripts/history_sites.py
      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add season public/data
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Game sites for past seasons"
            if git push; then gh workflow run deploy.yml --ref main || true; exit 0; fi
            cp season/geocode_cache.json "$RUNNER_TEMP/geocode_cache.json"
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/geocode_cache.json" season/geocode_cache.json
            python3 scripts/history_sites.py
          done
          exit 1
