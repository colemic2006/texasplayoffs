name: Update season data

# Pulls UIL brackets into season/<year>/<year>_season.xlsx and rebuilds
# public/data/<year>.json. Runs every 15 minutes during the playoffs (Nov-Dec), whenever
# the season workbook is uploaded, and on demand from the Actions tab. A run that changes
# nothing on the site commits nothing and doesn't redeploy.
on:
  push:
    branches: [main]
    paths: ['season/**']
  schedule:
    - cron: '*/15 * * 11,12 *'   # every 15 minutes in Nov and Dec (GitHub may run it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # to start the site deploy after a commit

concurrency:
  group: season-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl pdfplumber beautifulsoup4

      - name: Pull brackets from UIL
        continue-on-error: true
        run: python3 scripts/season.py prefill

      - name: Place game sites on the map
        continue-on-error: true
        run: python3 scripts/season.py locate

      - name: Build site data
        run: python3 scripts/season.py build

      - name: Link teams to their Dave Campbell's pages
        continue-on-error: true
        run: python3 scripts/dctf_teams.py

      - name: List team names to confirm in an issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/season.py review-issue

      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add season public/data
            # only the "last read" times of MaxPreps cards changed: nothing new for the site
            if git diff --cached --quiet -- . ':!season/*/maxpreps_cards.json'; then echo "No changes"; exit 0; fi
            git commit -q -m "Update season data from UIL brackets"
            if git push; then
              # the built-in token's push doesn't start the deploy on its own
              gh workflow run deploy.yml --ref main || true
              exit 0
            fi
            # main moved on while this ran (someone pushed): redo the update on top of it,
            # keeping the MaxPreps cards and map lookups this run already fetched
            echo "main changed during the run; redoing the update on top of it (attempt $attempt)"
            mkdir -p "$RUNNER_TEMP/keep"
            cp season/*/maxpreps_cards.json season/geocode_cache.json "$RUNNER_TEMP/keep/" 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            for f in "$RUNNER_TEMP"/keep/maxpreps_cards.json; do [ -f "$f" ] && cp "$f" season/*/maxpreps_cards.json; done
            [ -f "$RUNNER_TEMP/keep/geocode_cache.json" ] && cp "$RUNNER_TEMP/keep/geocode_cache.json" season/geocode_cache.json
            python3 scripts/season.py prefill || true
            python3 scripts/season.py locate || true
            python3 scripts/season.py build
          done
          echo "Could not push after 3 attempts"; exit 1
